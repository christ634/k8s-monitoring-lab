apiVersion: apps/v1
kind: Deployment
metadata:
  name: fragile-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fragile-api
  template:
    metadata:
      labels:
        app: fragile-api
    spec:
      containers:
      - name: fragile-api
        image: fragile-api:v1
        ports:
        - containerPort: 5000
        imagePullPolicy: Never # Importante: le dice a K8s que use la imagen que cargamos con 'kind load'
---
apiVersion: v1
kind: Service
metadata:
  name: fragile-api-service
spec:
  selector:
    app: fragile-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP